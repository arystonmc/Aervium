license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
iconFile="${mod_id}.png"
displayTest="IGNORE_ALL_VERSION"
description='''
Performance mod for Minecraft on the Vulkan renderer: steady frame times, stable ticks and built-in measurement tools.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="iris"
    type="discouraged"
    reason="Iris replaces the render pipeline that Aervium optimizes. Aervium keeps its optimizations off while Iris is installed."
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
