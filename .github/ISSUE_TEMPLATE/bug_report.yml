name: Bug Report
description: Report an issue or unexpected behavior in Kinetic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: environment
    attributes:
      label: System Environment
      description: Your OS, GPU, and Graphics Driver version
      placeholder: "e.g. Windows 11, NVIDIA RTX 4070 (Driver 560.81)"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Game & Mod Versions
      description: Minecraft version, NeoForge build, Kinetic version and other installed mods
      placeholder: "e.g. Minecraft 26.3, NeoForge 26.3.0.51-beta, Kinetic 0.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug
      placeholder: |
        1. Start game with Vulkan backend
        2. Enter world
        3. Open the Kinetic overlay with F7
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: Log Link
      description: Upload logs/latest.log to https://mclo.gs and paste the link here
      placeholder: "https://mclo.gs/..."
    validations:
      required: false

