name: Feature Request
description: Propose an enhancement or new performance feature for Aervium
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Aervium better? Let us know!
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Clear and concise description of the feature you want
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale / Use Case
      description: Why would this be a great addition to Aervium?
    validations:
      required: false

