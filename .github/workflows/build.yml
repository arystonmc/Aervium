name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Vanilla parity check
        run: |
          for modules in on off; do
            ./gradlew runParity -PparityModules=$modules
            grep 'Kinetic parity: tick' runs/parity/logs/latest.log | sed 's/.*Kinetic parity: //' > parity-$modules.txt
            cat parity-$modules.txt
          done
          test -s parity-on.txt
          diff parity-on.txt parity-off.txt

      - name: Worldgen parity check
        run: |
          for modules in on off; do
            JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dkinetic.parity.worldgen=true" ./gradlew runParity -PparityWorld=normal -PparityModules=$modules
            grep 'Kinetic worldgen check' runs/parity/logs/latest.log
            grep 'Kinetic worldgen check: terrain' runs/parity/logs/latest.log | sed 's/.*terrain/terrain/' > worldgen-$modules.txt
          done
          grep -q 'missing 0' worldgen-on.txt
          diff worldgen-on.txt worldgen-off.txt

      - name: World logic audits
        run: |
          JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dkinetic.parity.forceRadius=8 -Dkinetic.parity.mobs=300 -Dkinetic.parity.hoppers=500 -Dkinetic.parity.ticks=600 -Dkinetic.poiAudit=true -Dkinetic.collisionAudit=true -Dkinetic.hopperAudit=true" ./gradlew runParity -PparityWorld=normal
          grep 'Kinetic .* audit' runs/parity/logs/latest.log
          grep -q 'Kinetic poi audit: [1-9][0-9]* column searches, [1-9][0-9]* records, 0 mismatches' runs/parity/logs/latest.log
          grep -q 'Kinetic collision audit: [1-9][0-9]* entity collision searches skipped, 0 where vanilla found an entity' runs/parity/logs/latest.log
          grep -q 'Kinetic hopper audit: [1-9][0-9]* of [1-9][0-9]* item searches skippable, [1-9][0-9]* of [1-9][0-9]* container searches skippable, 0 where vanilla found an entity' runs/parity/logs/latest.log

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: kinetic
          path: build/libs/*.jar
