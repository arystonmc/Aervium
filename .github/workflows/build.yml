name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Vanilla parity check
        run: |
          for modules in on off; do
            ./gradlew runParity -PparityModules=$modules
            grep 'Aervium parity: tick' runs/parity/logs/latest.log | sed 's/.*Aervium parity: //' > parity-$modules.txt
            cat parity-$modules.txt
          done
          test -s parity-on.txt
          diff parity-on.txt parity-off.txt

      - name: Worldgen parity check
        run: |
          for modules in on off; do
            JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Daervium.parity.worldgen=true" ./gradlew runParity -PparityWorld=normal -PparityModules=$modules
            grep 'Aervium worldgen check' runs/parity/logs/latest.log
            grep 'Aervium worldgen check: terrain' runs/parity/logs/latest.log | sed 's/.*terrain/terrain/' > worldgen-$modules.txt
          done
          grep -q 'missing 0' worldgen-on.txt
          diff worldgen-on.txt worldgen-off.txt

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: aervium
          path: build/libs/*.jar
