plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named("test", Test) {
    useJUnitPlatform()
    testLogging {
        events "skipped", "failed"
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            programArguments.addAll '--graphicsBackend', 'vulkan'
        }

        server {
            server()
            programArgument '--nogui'
        }

        parity {
            server()
            gameDirectory = project.file('runs/parity')
            programArgument '--nogui'
            systemProperty 'aervium.parity', 'true'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    from('branding') {
        include 'logo.png'
        rename 'logo.png', "${mod_id}.png"
    }
    from('.') {
        include 'LICENSE.md'
    }
}

var setUpParityWorld = tasks.register('setUpParityWorld') {
    var parityDir = project.file('runs/parity')
    var modulesOn = !project.hasProperty('parityModules') || project.property('parityModules') != 'off'
    var normalWorld = project.hasProperty('parityWorld') && project.property('parityWorld') == 'normal'
    var modulesOff = project.hasProperty('parityOff') ? project.property('parityOff').toString().split(',').collect { it.trim() } : []
    doLast {
        new File(parityDir, 'parity-world').deleteDir()
        parityDir.mkdirs()
        new File(parityDir, 'eula.txt').text = 'eula=true\n'
        new File(parityDir, 'server.properties').text = [
                'level-name=parity-world',
                'level-seed=1095062134',
                normalWorld ? 'level-type=minecraft\\:normal' : 'level-type=minecraft\\:flat',
                normalWorld ? '' : 'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}',
                'generate-structures=' + normalWorld,
                'pause-when-empty-seconds=0',
                'spawn-protection=0',
                'online-mode=false',
                'server-port=25599',
                'view-distance=4',
                'simulation-distance=4',
        ].join('\n') + '\n'
        var config = new File(parityDir, 'config')
        config.mkdirs()
        var value = modulesOn ? 'true' : 'false'
        new File(config, 'aervium-modules.properties').text = [
                'shaderCache', 'pipelineCache', 'pipelineWarmup', 'compactChunkLocks', 'sectionSliceCache',
                'lightSnapshots', 'occlusionCulling', 'meshWorkers', 'poiSearch',
        ].collect { it + '=' + (modulesOff.contains(it) ? 'false' : value) }.join('\n') + '\n'
    }
}

tasks.matching { it.name == 'runParity' }.configureEach {
    dependsOn setUpParityWorld
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
